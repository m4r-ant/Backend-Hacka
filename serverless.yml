org: m4rant
service: alerta-utec

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::722204368591:role/LabRole  # 👈 tu LabRole

  # CORS para que el frontend (localhost:5173) pueda llamar sin errores
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173   # frontend local
        - "*"                     # opcional
      allowedMethods:
        - GET
        - POST
        - PATCH
        - OPTIONS
      allowedHeaders:
        - Content-Type

  environment:
    INCIDENTS_TABLE: ${sls:stage}-t_incidentes
    CONNECTIONS_TABLE: ${sls:stage}-t_conexiones
    WS_ENDPOINT: https://zisd0y9a8j.execute-api.us-east-1.amazonaws.com/dev
    # 👇 CAMBIA esto por el ARN REAL de tu SNS topic
    SNS_TOPIC_ARN: arn:aws:sns:us-east-1:722204368591:alerta-utec

functions:
  # --- HTTP: API de incidentes ---
  crearIncidente:
    handler: handlers/incident_handler.crear_incidente
    events:
      - httpApi:
          path: /incidentes
          method: post

  listarIncidentes:
    handler: handlers/incident_handler.listar_incidentes
    events:
      - httpApi:
          path: /incidentes
          method: get

  actualizarIncidente:
    handler: handlers/incident_handler.actualizar_incidente
    events:
      - httpApi:
          path: /incidentes/{id}
          method: patch

  # --- WebSocket: tiempo real ---
  wsConnect:
    handler: handlers/ws_handler.connect
    events:
      - websocket:
          route: $connect

  wsDisconnect:
    handler: handlers/ws_handler.disconnect
    events:
      - websocket:
          route: $disconnect

  wsDefault:
    handler: handlers/ws_handler.default_handler
    events:
      - websocket:
          route: $default

resources:
  Resources:
    IncidentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.INCIDENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: incidentId
            AttributeType: S
        KeySchema:
          - AttributeName: incidentId
            KeyType: HASH

    ConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONNECTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH

